name: listocheck
description: "Minimalistic list"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_sign_in: ^6.1.5
  googleapis: ^12.0.0
  googleapis_auth: ^1.4.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.10
  path_provider: ^2.1.0
  yaml: ^3.1.2
  flutter_riverpod: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_lint: ^2.3.0 # Для статического анализа
  flutter_native_splash: ^2.3.0

flutter:
  uses-material-design: true
  generate: true
